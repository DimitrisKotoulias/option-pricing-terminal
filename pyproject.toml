[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optpricing"
version = "0.1.0"
description = "European options pricing and validation toolkit (Black-Scholes, Monte Carlo, Binomial Tree)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dimitris Kotoulias" }]
keywords = ["options", "black-scholes", "monte-carlo", "binomial-tree", "quantitative-finance"]
dependencies = [
    "numpy>=1.23,<3.0",
    "scipy>=1.9,<2.0",
    "pandas>=1.5,<3.0",
]

[project.urls]
Homepage = "https://github.com/DimitrisKotoulias/option-pricing-terminal"
Repository = "https://github.com/DimitrisKotoulias/option-pricing-terminal"
Issues = "https://github.com/DimitrisKotoulias/option-pricing-terminal/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "plotly>=5.10"]
# st.html (1.39+), width="stretch" on st.button (1.49+) and st.iframe (1.58+)
# are all used by app/; anything older raises AttributeError on first render.
# streamlit>=1.58 itself requires Python >=3.10, so this extra (unlike the core
# library, which supports 3.9) is only installable on 3.10+.
app = ["streamlit>=1.58", "plotly>=5.10"]
data = ["yfinance>=0.2", "openpyxl>=3.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

# black only reformats; it will not tell you about an unused import or a
# mis-sorted import block. ruff covers both (E/F = pycodestyle + pyflakes,
# I = import sorting) and is the one extra tool worth the CI second.
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
# black already wraps every line it can; what is left over E501 are string
# literals it will not split (the injected CSS, long HTML f-strings). Flagging
# those would only invite worse-reading manual breaks.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["optpricing"]
# app/ is a Streamlit entry point, not a package: its modules import each other
# flat off sys.path. Naming them keeps them in their own group instead of being
# sorted in among numpy and streamlit.
known-local-folder = ["_data", "_panels", "_tabs", "_theme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
