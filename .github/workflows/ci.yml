name: Options Pricing Toolkit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: nothing here writes to the repo, so the token gets read-only
# access rather than whatever the repository default happens to be.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant --
# cancel it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting is checked once on a modern Python rather than across the
    # matrix: black's own floor is Python 3.10+, so the 3.9 leg resolves an
    # older black that formats differently and would fail spuriously.
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v4 is repointed
      # by the publisher at will, so pinning to it is trusting future code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install black ruff
      - run: black --check src app tests scripts conftest.py
      # black reformats but never reports an unused import or a mis-sorted
      # import block; ruff (E/F/I) covers what it cannot see.
      - run: ruff check src app tests scripts conftest.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,data]"
      - name: Install dashboard extra
        # The app extra needs streamlit>=1.58 (for st.html / st.iframe /
        # width="stretch"), which requires Python >=3.10. The library itself
        # still supports 3.9, so that leg simply skips the dashboard deps.
        if: matrix.python-version != '3.9'
        run: pip install -e ".[app]"
      - name: Run pytest
        # The coverage report used to be generated and then thrown away. A floor
        # makes it mean something: coverage can rise, but not silently rot.
        run: pytest --cov=optpricing --cov-report=term-missing --cov-fail-under=80
