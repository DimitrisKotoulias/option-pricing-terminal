name: Options Pricing Toolkit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    # Formatting is checked once on a modern Python rather than across the
    # matrix: black's own floor is Python 3.10+, so the 3.9 leg resolves an
    # older black that formats differently and would fail spuriously.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black
      - run: black --check src app tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,data]"
      - name: Install dashboard extra
        # The app extra needs streamlit>=1.58 (for st.html / st.iframe /
        # width="stretch"), which requires Python >=3.10. The library itself
        # still supports 3.9, so that leg simply skips the dashboard deps.
        if: matrix.python-version != '3.9'
        run: pip install -e ".[app]"
      - name: Run pytest
        run: pytest --cov=optpricing --cov-report=xml
